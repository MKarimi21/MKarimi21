<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      text {
        font-family: 'JetBrains Mono', monospace;
      }
      .bg { fill: #1E1E2E; }
      .green { fill: #50FA7B; }
      .blue { fill: #8BE9FD; }
      .pink { fill: #FF79C6; }
      .purple { fill: #BD93F9; }
      .orange { fill: #FFB86C; }
      .yellow { fill: #F1FA8C; }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .typing1 { animation: typing1 2s steps(30) forwards; overflow: hidden; white-space: nowrap; }
      .typing2 { animation: typing2 2s steps(40) 2s forwards; overflow: hidden; white-space: nowrap; }
      .typing3 { animation: typing3 2s steps(20) 4s forwards; overflow: hidden; white-space: nowrap; }
      .typing4 { animation: typing4 2s steps(25) 6s forwards; overflow: hidden; white-space: nowrap; }
      @keyframes typing1 { from { width: 0 } to { width: 250px } }
      @keyframes typing2 { from { width: 0 } to { width: 400px } }
      @keyframes typing3 { from { width: 0 } to { width: 150px } }
      @keyframes typing4 { from { width: 0 } to { width: 200px } }
      .hand { animation: wave 2s ease-in-out infinite; transform-origin: 70% 70%; }
      @keyframes wave { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(20deg); } 75% { transform: rotate(-10deg); } }
    </style>
  </defs>
  <rect class="bg" width="800" height="400" rx="8" />

  <!-- Terminal title bar -->
  <rect x="0" y="0" width="800" height="30" fill="#282A36" rx="8" />
  <circle cx="15" cy="15" r="6" fill="#FF5555" />
  <circle cx="35" cy="15" r="6" fill="#FFB86C" />
  <circle cx="55" cy="15" r="6" fill="#50FA7B" />
  <text x="400" y="20" class="green" text-anchor="middle" font-size="12" font-weight="bold">~/github-profile</text>

  <!-- Content area -->
  <text x="20" y="70" class="purple" font-size="16">❯ <tspan class="blue">about me</tspan></text>

  <!-- Name and bio with typing animation + hand wave -->
  <text x="30" y="100" class="typing1" font-size="18" font-weight="bold">Mostafa Karimi</text>
  <text x="280" y="95" class="hand" font-size="28" dominant-baseline="middle">👋</text>

  <text x="20" y="130" class="green typing2" font-size="14">Data Driven BPM</text>

  <!-- GitHub stats -->
  <text x="20" y="170" class="purple" font-size="16">❯ <tspan class="blue">github stats</tspan></text>

  <text x="30" y="200" class="typing3 orange" font-size="15">▶ Commits: 19</text>
  <text x="30" y="225" class="typing3 yellow" font-size="15" style="animation-delay: 6.5s;">▶ Stars: 11</text>
  <text x="30" y="250" class="typing3 pink" font-size="15" style="animation-delay: 7s;">▶ PRs: 23</text>
  <text x="30" y="275" class="typing3 green" font-size="15" style="animation-delay: 7.5s;">▶ Issues: 4</text>
  <text x="30" y="300" class="typing3 blue" font-size="15" style="animation-delay: 8s;">▶ Repos: 21</text>
  <text x="30" y="325" class="typing3 purple" font-size="15" style="animation-delay: 8.5s;">▶ Followers: 55</text>
  <text x="30" y="350" class="typing3 orange" font-size="15" style="animation-delay: 9s;">▶ Contributed to: 0 repos</text>

  <!-- Blinking cursor -->
  <text x="530" y="350" class="green cursor" font-size="18" style="animation-delay: 9.5s;">_</text>
</svg>
