<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label { font-size: 14px; font-weight: bold; fill: #24292f; }
      .value { font-size: 18px; font-weight: bold; fill: #0969da; font-family: monospace; }
      .dots { font-size: 16px; fill: #888; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="350" fill="#ffffff" rx="10"/>
  
  <!-- Border -->
  <rect width="400" height="350" fill="none" stroke="#d0d7de" stroke-width="2" rx="10"/>
  
  <!-- Commits -->
  <text x="20" y="40" class="label">Total Commits:</text>
  <text id="commit_data" x="200" y="40" class="value">0</text>
  <text id="commit_data_dots" x="220" y="40" class="dots"></text>
  
  <!-- Stars -->
  <text x="20" y="85" class="label">Stars Received:</text>
  <text id="star_data" x="200" y="85" class="value">0</text>
  <text id="star_data_dots" x="220" y="85" class="dots"></text>
  
  <!-- Repositories -->
  <text x="20" y="130" class="label">Repositories:</text>
  <text id="repo_data" x="200" y="130" class="value">0</text>
  <text id="repo_data_dots" x="220" y="130" class="dots"></text>
  
  <!-- Contributions -->
  <text x="20" y="175" class="label">Contributions:</text>
  <text id="contrib_data" x="200" y="175" class="value">0</text>
  <text id="contrib_data_dots" x="220" y="175" class="dots"></text>
  
  <!-- Followers -->
  <text x="20" y="220" class="label">Followers:</text>
  <text id="follower_data" x="200" y="220" class="value">0</text>
  <text id="follower_data_dots" x="220" y="220" class="dots"></text>
  
  <!-- Lines Added -->
  <text x="20" y="265" class="label">Lines Added:</text>
  <text id="loc_add" x="200" y="265" class="value">0</text>
  <text id="loc_add_dots" x="220" y="265" class="dots"></text>
  
  <!-- Lines Deleted -->
  <text x="20" y="310" class="label">Lines Deleted:</text>
  <text id="loc_del" x="200" y="310" class="value">0</text>
  <text id="loc_del_dots" x="220" y="310" class="dots"></text>
  
  <!-- Lines Total -->
  <text x="20" y="355" class="label">Net Lines:</text>
  <text id="loc_data" x="200" y="355" class="value">0</text>
  <text id="loc_data_dots" x="220" y="355" class="dots"></text>
</svg>
